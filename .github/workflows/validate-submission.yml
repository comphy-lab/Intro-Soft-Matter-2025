name: Validate student submission

# pull_request_target runs this file as it is on main, so a Pull Request cannot
# change the rules it is checked against. The job has no token and no secrets,
# and it never checks out or runs anything from the Pull Request: it fetches the
# proposed commits into a bare repository and reads paths and file modes only.
on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

concurrency:
  group: validate-submission-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate paths and filenames without checking out submitted code
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          MERGE_REF_ATTEMPTS: "12"
          MERGE_REF_WAIT_SECONDS: "10"
        shell: bash
        run: |
          set -euo pipefail

          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              echo "Trusted maintainer PR: student filename rules do not apply."
              exit 0
              ;;
          esac

          if [[ ! "$PR_NUMBER" =~ ^[0-9]+$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Unexpected Pull Request metadata."
            exit 1
          fi

          errors=0
          found_v1=0
          found_v2=0
          changed_count=0
          deleted_count=0

          work_dir=$(mktemp -d)
          trap 'rm -rf -- "$work_dir"' EXIT
          export GIT_DIR="$work_dir/repo.git"
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0
          git init --quiet --bare "$GIT_DIR"

          # GitHub's test merge of this Pull Request into main. Its first parent
          # is main, so the diff below is exactly what merging would change, even
          # when the fork is behind main. GitHub builds it shortly after a push,
          # so wait until it is the merge of this head commit.
          merged=
          for ((attempt = 1; attempt <= MERGE_REF_ATTEMPTS; attempt++)); do
            if git -c fetch.fsckObjects=true fetch --quiet --no-tags --depth=2 "$REPO_URL" \
                "+refs/pull/${PR_NUMBER}/merge:refs/validate/merge" 2>/dev/null \
              && [[ "$(git rev-parse --verify --quiet 'refs/validate/merge^2')" == "$HEAD_SHA" ]]; then
              merged=$(git rev-parse --verify refs/validate/merge)
              break
            fi
            if ((attempt < MERGE_REF_ATTEMPTS)); then
              sleep "$MERGE_REF_WAIT_SECONDS"
            fi
          done
          if [[ -z "$merged" ]]; then
            echo "::error::No test merge of this Pull Request is available. Resolve any conflict with main, then re-run the check."
            exit 1
          fi
          base=$(git rev-parse --verify "${merged}^1")

          # A rename must be checked as both a source deletion and a destination.
          # Materialize the diff first so Git errors fail the step.
          diff_dir="$work_dir/diff"
          mkdir "$diff_dir"
          git diff --no-renames --diff-filter=D --name-only -z "$base" "$merged" > "$diff_dir/deleted"
          git diff --no-renames --name-only -z "$base" "$merged" > "$diff_dir/changed"
          while IFS= read -r -d '' path; do
            deleted_count=$((deleted_count + 1))
          done < "$diff_dir/deleted"

          if ((deleted_count > 0)); then
            echo "::error::Student Pull Requests must not delete existing files."
            errors=1
          fi

          while IFS= read -r -d '' path; do
            changed_count=$((changed_count + 1))

            # Paths are printed below, so refuse ones that could forge log commands.
            if [[ "$path" == *[[:cntrl:]]* ]]; then
              echo "::error::A changed filename contains control characters."
              errors=1
              continue
            fi

            if [[ "$path" != submissions/* ]]; then
              echo "::error file=$path::Student files must be placed directly in submissions/."
              errors=1
              continue
            fi

            filename=${path#submissions/}
            if [[ "$filename" == */* ]]; then
              echo "::error file=$path::Do not create nested folders inside submissions/."
              errors=1
              continue
            fi

            required_prefix="${PR_AUTHOR}_"
            if [[ "$filename" != "$required_prefix"* ]]; then
              echo "::error file=$path::Filename must start with ${required_prefix}"
              errors=1
            fi

            student_filename=${filename#"$required_prefix"}
            if [[ "$student_filename" =~ -v1([._-]|$) ]]; then
              found_v1=1
            fi
            if [[ "$student_filename" =~ -v2([._-]|$) ]]; then
              found_v2=1
            fi

            mode=$(git ls-tree "$merged" -- "$path" | awk '{print $1}')
            if [[ "$mode" != "100644" && "$mode" != "100755" ]]; then
              echo "::error file=$path::Only regular files are accepted as submissions."
              errors=1
            fi
          done < "$diff_dir/changed"

          if ((changed_count == 0)); then
            echo "::error::The Pull Request contains no changed files."
            errors=1
          fi

          if ((found_v1 == 0)); then
            echo "::error::Include the initial LLM output with -v1 in its filename."
            errors=1
          fi
          if ((found_v2 == 0)); then
            echo "::error::Include the refined solution with -v2 in its filename."
            errors=1
          fi

          if ((errors != 0)); then
            exit 1
          fi

          echo "Submission paths and filenames are valid. Submitted code was neither checked out nor executed."
